name: tests

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, engine-extraction]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jit_agent_app
          POSTGRES_PASSWORD: jit_agent_test_pw
          POSTGRES_DB: jit_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jit_agent_app -d jit_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://jit_agent_app:jit_agent_test_pw@localhost:5432/jit_agent_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv==0.11.33

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run static checks
        run: |
          command -v pwsh
          uv run ruff check .
          uv run python scripts/verify_source_baseline.py
          uv run python scripts/audit_registries.py
          uv run python scripts/audit_constraints.py --fail-unregistered

      - name: Run deterministic constraint calibration
        run: uv run python benchmarks/run_deterministic_constraints.py

      - name: Collect local-model acceptance gates
        run: >-
          uv run pytest --collect-only -q -m ollama
          tests/test_acceptance_restart.py
          tests/test_cross_conversation_memory.py
          tests/test_acceptance_conversation_continuity.py
          tests/test_redteam_epistemic_memory_native.py
          tests/test_redteam_memory_authority_native.py

      - name: Run test suite
        run: uv run pytest -q -ra --junitxml=test-results.xml

      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-test-results
          path: test-results.xml
